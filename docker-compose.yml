# One command to build and run the media worker in its Linux container.
# Secrets come from your local .env (see .env.example). Open http://localhost:8080
#
# Code is mounted as volumes + uvicorn --reload, so editing Python files takes
# effect without rebuilding the image (only requirements changes need a rebuild).
services:
  media-worker:
    build:
      context: .
      dockerfile: media-worker/Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      # Backend code is mounted for --reload. The frontend is NOT mounted: it's
      # built into the image (dist/). For live frontend dev run `cd web && npm run
      # dev` (Vite :5173 proxies the API to this worker).
      - ./media-worker:/app/media-worker
      - ./shared:/app/shared
      # Downloaded Smart Turn weights (see models/README.md). Mounting keeps the
      # large .onnx on the host so it survives rebuilds and isn't baked in.
      - ./models:/app/models
      # Persisted interviews (Phase 8): recruiter dashboard reads/writes here.
      - ./data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
